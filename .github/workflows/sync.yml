name: Sync Repo

on:
  push:
    branches:
      - trunk
      - 6.[0-9]*.x
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'shopware/SwagPayPal'
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shopware/octo-sts-action@main
        id: sts-swagpaypal-private
        with:
          scope: shopware
          identity: SwagPayPalPrivateSync

      - name: Push to private fork
        run: |
          git config "http.https://github.com/shopware/SwagPayPal-private.git/.extraheader" "AUTHORIZATION: basic $(echo -n "x-access-token:${{ steps.sts-swagpaypal-private.outputs.token }}" | base64 -w0)"
          git remote add private https://github.com/shopware/SwagPayPal-private.git
          git fetch private
          git push -f private ${{ github.ref }}
