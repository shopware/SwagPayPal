name: lint

on:
  push:
    branches:
      - 6.5.x
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  check:
      if: always()
      needs:
        - phpstan
        - ecs
        - validate-openapi-typescript
        - bc-check
        - admin-eslint
        - admin-jest
        - storefront-eslint
      runs-on: ubuntu-latest
      steps:
        - uses: re-actors/alls-green@v1.2.2
          with:
            jobs: ${{ toJSON(needs) }}

  phpstan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        PLATFORM_BRANCH: ["v6.5.5.1", "6.5.x"]
      fail-fast: false
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-commercial: true
          install-admin: true
          install-storefront: true
          shopware-version: ${{ matrix.PLATFORM_BRANCH }}

      - id: phpstan
        run: composer -d custom/plugins/SwagPayPal run phpstan

      # Baselines can only be generated with the matching Shopware version.
      # Regenerate the relevant one from scratch and print the diff, so it can be applied without a local setup.
      - name: Print baseline diff
        if: failure() && steps.phpstan.outcome == 'failure'
        working-directory: custom/plugins/SwagPayPal
        env:
          PLATFORM_BRANCH: ${{ matrix.PLATFORM_BRANCH }}
        run: |
          baseline="phpstan-${PLATFORM_BRANCH#v}.neon.dist"
          if [ -f "$baseline" ]; then
            # versioned baseline, e.g. phpstan-6.6.0.0.neon.dist
            export PHPSTAN_SKIP_VERSIONED_CONFIG=1
          else
            baseline="phpstan-baseline.neon"
            sed -i "/- $baseline/d" phpstan.neon.dist
          fi

          php bin/phpstan-config-generator.php > /dev/null
          php ../../../vendor/bin/phpstan analyze --no-progress --generate-baseline=phpstan-generated.neon --allow-empty-baseline || true
          mv phpstan-generated.neon "$baseline"

          git diff --no-color -- "$baseline" | tee baseline.diff
          {
            echo "### Updated \`$baseline\` (${PLATFORM_BRANCH})"
            echo 'Apply with `git apply baseline.diff` (download the artifact) or copy the diff below.'
            echo '<details><summary>Show diff</summary>'
            echo
            echo '```diff'
            cat baseline.diff
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline diff
        if: failure() && steps.phpstan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-baseline-diff-${{ matrix.PLATFORM_BRANCH }}
          path: custom/plugins/SwagPayPal/baseline.diff
          if-no-files-found: ignore

  ecs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal

      - name: Run ecs
        run: composer -d custom/plugins/SwagPayPal run ecs

  bc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal

      # setup-extension re-checks out the plugin without persisted credentials,
      # which breaks fetching from private repositories
      - name: Fetch SwagPayPal
        working-directory: custom/plugins/SwagPayPal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --unshallow origin

      # The bc-checker of Shopware 6.5 reads the exclusions from the Shopware root instead of the working directory
      - name: Use SwagPayPal bc-check exclusions
        run: cp custom/plugins/SwagPayPal/.bc-exclude.php .bc-exclude.php

      - name: Run bc-check
        working-directory: custom/plugins/SwagPayPal
        if: github.event_name == 'pull_request' && !contains(github.base_ref, '/feature/')
        run: composer bc-check -- --format=github-actions --from="origin/${{ github.base_ref }}"

  validate-openapi-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-admin: true
          install-storefront: true

      - working-directory: custom/plugins/SwagPayPal
        run: |
          ${GITHUB_WORKSPACE}/bin/console bundle:dump
          composer init:admin
          composer openapi:generate
          git update-index --refresh || printf ''
          git diff --exit-code src/Resources/app/administration/src/types/openapi.d.ts || (echo "Please run 'composer openapi:generate' to update openapi.d.ts" && exit 1)
          git diff --exit-code src/Resources/Schema || (echo "Please run 'composer openapi:generate' to update Resources/Schema files" && exit 1)

  admin-eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-admin: true

      - name: Run ESLint
        env:
          ADMIN_PATH: ${{ github.workspace }}/src/Administration/Resources/app/administration
        working-directory: custom/plugins/SwagPayPal
        run: |
          composer run init:admin
          composer run lint:admin:ci

  admin-jest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-admin: true

      - name: Run ESLint
        env:
          ADMIN_PATH: ${{ github.workspace }}/src/Administration/Resources/app/administration
        working-directory: custom/plugins/SwagPayPal
        run: composer run jest

  storefront-eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-commercial: true
          install-storefront: true

      - name: Run ESLint
        env:
          STOREFRONT_PATH: ${{ github.workspace }}/src/Storefront/Resources/app/storefront
        working-directory: custom/plugins/SwagPayPal
        run: |
          composer init:storefront
          composer lint:storefront
