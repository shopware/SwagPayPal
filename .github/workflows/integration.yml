name: integration

on:
  push:
    branches:
      - 6.5.x
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
      if: always()
      needs: [build-zip, test-install-zip, phpunit, acceptance]
      runs-on: ubuntu-latest
      steps:
        - uses: re-actors/alls-green@v1.2.2
          with:
            jobs: ${{ toJSON(needs) }}
            allowed-skips: '["acceptance"]'

  build-zip:
    runs-on: ubuntu-latest
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Build and validate zip
        uses: shopware/github-actions/build-zip@main
        with:
          extensionName: SwagPayPal

  test-install-zip:
    needs: build-zip
    runs-on: ubuntu-latest
    strategy:
      matrix:
        PLATFORM_BRANCH: ["v6.5.5.1", "6.5.x"]
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Test install zip
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          extension-zip: ${{ needs.build-zip.outputs.artifact-url }}
          shopware-version: ${{ matrix.PLATFORM_BRANCH }}

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        MYSQL_IMAGE: ["mysql:8.0", "mariadb:10.3", "mariadb:10.5"]
        PLATFORM_BRANCH: ["v6.5.5.1", "6.5.x"]
        PHP_VERSION: ["8.1", "8.2"]
        WITH_COMMERCIAL: [true, false]
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/SwagPayPal

      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-commercial: ${{ matrix.WITH_COMMERCIAL }}
          install-admin: true
          install-storefront: true
          mysql-version: ${{ matrix.MYSQL_IMAGE }}
          php-version: ${{ matrix.PHP_VERSION }}
          shopware-version: ${{ matrix.PLATFORM_BRANCH }}

      - name: Run PHPUnit
        working-directory: custom/plugins/SwagPayPal
        run: composer phpunit -- --coverage-cobertura cobertura.xml --coverage-text

  acceptance:
    needs: test-install-zip
    # The PayPal sandbox credentials only exist in the public repository's environment
    if: github.repository == 'shopware/SwagPayPal' && ((needs.test-install-zip.result == 'success' && contains(github.event.pull_request.labels.*.name, 'run/acceptance')) || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    environment: acceptance-production
    services:
      redis:
        image: redis:7.0
        ports:
          - '9200:9200'
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - '1025:1025'
          - '8025:8025'
    env:
      APP_ENV: prod
      APP_DEBUG: '1'
      MAILER_DSN: smtp://localhost:1025
      PLUGIN_PATH: ./paypal
      MONOLOG_CONFIG: |
        monolog:
          handlers:
            paypal:
              type: stream
              level: debug
              channels: [paypal]
              path: '%kernel.project_dir%/paypal/tests/acceptance/paypal.log'
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.PLUGIN_PATH }}

      - name: Download zip
        uses: actions/download-artifact@v8
        with:
          name: SwagPayPal.zip
          # The artifact is the extension zip itself, not an archive around it.
          skip-decompress: true

      - name: Setup SwagPayPal
        uses: ./paypal/.github/actions/setup-paypal
        with:
          extension-zip: SwagPayPal.zip
          env: prod
          install-admin: true
          install-storefront: true
          install-commercial: true

      - uses: actions/checkout@v5
        with:
          path: ${{ env.PLUGIN_PATH }}

      # Shopware 6.5 is built with Node.js 18, but the acceptance test suite requires Node.js 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup acceptance
        uses: ./paypal/.github/actions/setup-acceptance
        with:
          path: ${{ env.PLUGIN_PATH }}/tests/acceptance

      - name: Prepare logging
        run: echo "$MONOLOG_CONFIG" > ./config/packages/monolog.yaml

      - name: Prepare environment variables
        run: |
          symfony console cache:clear --env="${APP_ENV}" || true
          # Shopware 6.5 has no integration:create command, the test suite creates an integration with the default admin user instead
          echo "APP_URL=${APP_URL}" >> "${PLUGIN_PATH}/tests/acceptance/.env"

      - name: Run playwright
        working-directory: ${{ env.PLUGIN_PATH }}/tests/acceptance
        run: npx playwright test --reporter=${{ github.event.act && 'line' || 'github' }} --trace=on-first-retry
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MERCHANT_ID: ${{ secrets.PAYPAL_MERCHANT_ID }}
          PAYPAL_SANDBOX: ${{ secrets.PAYPAL_SANDBOX }}
          PAYPAL_CUSTOMER_ID: ${{ secrets.PAYPAL_CUSTOMER_ID  }}
          PAYPAL_CUSTOMER_PASSWORD: ${{ secrets.PAYPAL_CUSTOMER_PASSWORD  }}

      - name: Compress and encrypt test-results
        if: always()
        working-directory: ${{ env.PLUGIN_PATH }}/tests/acceptance
        run: zip -r -P "${{ secrets.ARTIFACT_PASSWORD }}" test-results.zip test-results/ paypal.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-result
          path: ${{ env.PLUGIN_PATH }}/tests/acceptance/test-results.zip
          retention-days: 3
