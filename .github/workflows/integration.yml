name: Integration
on:
  push:
    branches:
      - trunk
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # to avoid artifact conflicts
      matrix:
        PLATFORM_BRANCH: ["v6.7.0.0", "trunk"]
    steps:
      - name: Attempt to download the artifact
        id: artifact-download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ format('{0}.zip', github.event.repository.name) }}
          path: /tmp/existing-artifact

      - name: Build and validate zip
        if: steps.artifact-download.outcome != 'success'
        uses: shopware/github-actions/build-zip@main
        with:
          extensionName: ${{ github.event.repository.name }}

      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/${{ github.event.repository.name }}

      - name: Test install zip
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          extension-zip: ${{ steps.upload.outputs.artifact-url }}
          shopware-version: ${{ matrix.PLATFORM_BRANCH }}

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        MYSQL_IMAGE: ["mysql:8.0"]
        PLATFORM_BRANCH: ["v6.7.0.0", "trunk"]
        PHP_VERSION: ["8.2", "8.3", "8.4"]
        WITH_COMMERCIAL: [true]
        include:
          # without commercial, 6.7.0.0
          - WITH_COMMERCIAL: false
            PLATFORM_BRANCH: "v6.7.0.0"
            MYSQL_IMAGE: "mysql:8.0"
            PHP_VERSION: "8.4"

          # without commercial, trunk
          - WITH_COMMERCIAL: false
            PLATFORM_BRANCH: "trunk"
            MYSQL_IMAGE: "mysql:8.0"
            PHP_VERSION: "8.4"

          # mariadb
          - WITH_COMMERCIAL: true
            PLATFORM_BRANCH: "trunk"
            MYSQL_IMAGE: "mariadb:10.11"
            PHP_VERSION: "8.2"
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
    steps:
      - name: Checkout SwagPayPal
        uses: actions/checkout@v4
        with:
          path: custom/plugins/${{ github.event.repository.name }}
      - name: Setup SwagPayPal
        uses: ./custom/plugins/SwagPayPal/.github/actions/setup-paypal
        with:
          install-commercial: ${{ matrix.WITH_COMMERCIAL }}
          install-admin: true
          install-storefront: true
          mysql-version: ${{ matrix.MYSQL_IMAGE }}
          php-version: ${{ matrix.PHP_VERSION }}
          shopware-version: ${{ matrix.PLATFORM_BRANCH }}
      - name: Run PHPUnit
        working-directory: custom/plugins/${{ github.event.repository.name }}
        run: |
          composer dump-autoload --dev
          php -d pcov.enabled=1 -d pcov.directory=$PWD/src -d pcov.exclude='~(vendor|tests|node_modules)~' \
            ${GITHUB_WORKSPACE}/vendor/bin/phpunit \
            --configuration phpunit.xml.dist \
            --log-junit ${GITHUB_WORKSPACE}/phpunit.junit.xml \
            --coverage-cobertura ${GITHUB_WORKSPACE}/cobertura.xml \
            --coverage-text
