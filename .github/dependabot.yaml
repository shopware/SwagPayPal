version: 2
updates:
  - package-ecosystem: npm
    directory: '/src/Resources/app/administration'
    target-branch: 6.6.x
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build: '
    groups:
      all:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: '/src/Resources/app/storefront'
    target-branch: 6.6.x
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build: '
    groups:
      all:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: '/tests/acceptance'
    target-branch: 6.6.x
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build: '
    groups:
      all:
        patterns:
          - '*'
    ignore:
      # typescript is pinned to v6: typescript-eslint@8.65.0 (latest) peers typescript >=4.8.4 <6.1.0,
      # so typescript@7 cannot resolve for type-aware linting. Drop once typescript-eslint supports v7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
      - 'javascript'
      - 'run/acceptance'
